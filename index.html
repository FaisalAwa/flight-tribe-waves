<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flight Tribe — .925 · Made on Earth</title>
    <meta name="description" content="Flight Tribe — hand-cast sterling silver. Winged hearts, gem-set dice, the eagle seal. One tribe, one stone at a time. Made in the USA." />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="robots" content="index, follow" />

    <!-- TODO: swap https://your-domain.example for the real production domain
         once it's decided (og:url + canonical must be absolute per spec). -->
    <link rel="canonical" href="https://your-domain.example/" />

    <!-- Open Graph / social share card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flight Tribe" />
    <meta property="og:title" content="Flight Tribe — .925 · Made on Earth" />
    <meta property="og:description" content="Flight Tribe — hand-cast sterling silver. Winged hearts, gem-set dice, the eagle seal. One tribe, one stone at a time. Made in the USA." />
    <meta property="og:url" content="https://your-domain.example/" />
    <meta property="og:image" content="https://your-domain.example/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flight Tribe — .925 · Made on Earth" />
    <meta name="twitter:description" content="Flight Tribe — hand-cast sterling silver. Winged hearts, gem-set dice, the eagle seal. One tribe, one stone at a time. Made in the USA." />
    <meta name="twitter:image" content="https://your-domain.example/assets/og-image.png" />

    <!-- Anton (brutal condensed display) + Space Grotesk (grotesk body/hallmark) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
